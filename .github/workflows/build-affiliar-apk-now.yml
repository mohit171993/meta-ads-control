name: Build Affiliar APK Now

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-affiliar-apk-now.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Affiliar APK branch
        uses: actions/checkout@v4
        with:
          ref: affiliar-apk

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AffiliarTracker-Refresh-APK
          path: app/build/outputs/apk/debug/app-debug.apk
