name: Build Telegram Ads APK

on:
  push:
    branches:
      - telegram-ads-dashboard-apk
    paths:
      - "telegram-ads-apk/**"
      - ".github/workflows/build-telegram-ads-apk.yml"
  pull_request:
    branches:
      - main
    paths:
      - "telegram-ads-apk/**"
      - ".github/workflows/build-telegram-ads-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK 34
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build installable APK
        working-directory: telegram-ads-apk
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp telegram-ads-apk/app/build/outputs/apk/debug/app-debug.apk Telegram-Ads-Dashboard.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Ads-Dashboard-APK
          path: Telegram-Ads-Dashboard.apk
          if-no-files-found: error
