name: Build Telegram Ads APK

on:
  pull_request:
    branches:
      - main
    paths:
      - "telegram-ads-apk/**"
      - ".github/workflows/build-telegram-ads-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build installable APK
        working-directory: telegram-ads-apk
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp telegram-ads-apk/app/build/outputs/apk/debug/app-debug.apk Telegram-Ads-Dashboard.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Ads-Dashboard-APK
          path: Telegram-Ads-Dashboard.apk
          if-no-files-found: error
