<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Windsor Login</title>
<style>
:root{--bg:#0b1020;--panel:#11182b;--text:#edf2ff;--muted:#9fb0d0;--line:#25314f;--accent:#7aa2ff;--bad:#ff8a9a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:20px}
.card{width:min(420px,100%);background:linear-gradient(180deg,#11182b,#162038);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
h1{margin:0 0 6px;font-size:28px}.sub{color:var(--muted);font-size:13px;margin-bottom:22px}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}
input{width:100%;background:#0e1628;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(122,162,255,.15)}
button{width:100%;margin-top:18px;border:0;border-radius:12px;padding:13px 14px;background:var(--accent);color:#081226;font-weight:800;font-size:15px}
.error{margin:0 0 14px;background:#4b1c24;color:#ffd9df;padding:10px 12px;border-radius:10px;font-size:13px}
.note{margin-top:14px;color:var(--muted);font-size:11px;text-align:center}
</style>
</head>
<body>
<form class="card" method="post" action="/windsor-login" autocomplete="on">
  <h1>Windsor</h1>
  <div class="sub">Meta Ads Dashboard</div>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <label for="username">Username</label>
  <input id="username" name="username" type="text" value="{{ username|e }}" autocomplete="username" required>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
  <button type="submit">Sign in</button>
  <div class="note">Your session stays signed in on this device.</div>
</form>
</body>
</html>
